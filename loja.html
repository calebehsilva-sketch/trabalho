<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loja Rápida</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f4f6;
            padding: 14px;
        }

        .container {
            max-width: 350px;
            margin: auto;
        }

        .tela {
            display: none;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .tela.ativa {
            display: block;
        }

        h1,
        h2 {
            text-align: center;
            color: #2903eb;
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 7px;
            background: #2483eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d3ed8;
        }

        .btn-verde {
            background: #dabe43;
        }

        .btn-verde:hover {
            background: #b49b2f;
        }

        .btn-vermelho {
            background: #1a1673;
        }

        .btn-vermelho:hover {
            background: #b86c1c;
        }

        /* =========================
           PRODUTOS
        ========================== */

        .produto {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            text-align: center;
        }

        .produto h3 {
            margin-bottom: 10px;
        }

        /* Imagens proporcionais */
        .produto img {
            display: block;
            width: 100%;
            max-width: 180px;
            height: 160px;
            margin: 10px auto 15px;
            object-fit: contain;
            border-radius: 8px;
        }

        .preco {
            display: block;
            color: #3bbba6;
            font-size: 19px;
            font-weight: bold;
            margin-top: 8px;
        }

        /* =========================
           CARRINHO
        ========================== */

        .item-carrinho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .item-carrinho span {
            flex: 1;
        }

        .item-carrinho button {
            width: auto;
            margin: 0;
            padding: 7px 10px;
            background: #dc2326;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            color: #2563eb;
            margin-top: 15px;
            text-align: right;
        }

        /* =========================
           PAGAMENTO
        ========================== */

        .qr {
            text-align: center;
            padding: 20px;
        }

        .qr-code {
            display: block;
            width: 200px;
            height: 200px;
            margin: 20px auto;
            background: white;
            border: 8px solid rgb(146, 99, 99);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        /* =========================
           CADASTRO
        ========================== */

        .dados {
            background: #eff6ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .dados p {
            margin: 8px 0;
        }

        .vazio {
            text-align: center;
            color: #7fdeeb;
            padding: 15px;
        }

        .contador {
            background: #935bc5;
            color: white;
            border-radius: 20px;
            padding: 3px 9px;
            font-size: 13px;
            margin-left: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- =========================
         TELA INICIAL
    ========================== -->

    <div class="tela ativa" id="tela1">

        <h1>🛒 Loja Rápida</h1>

        <p style="text-align: center;">
            Bem-vindo à Loja Rápida!
        </p>

        <button onclick="mostrarTela('tela2')">
            👤 Cadastro
        </button>

        <button onclick="mostrarTela('tela3')">
            🛍️ Produtos
        </button>

        <button onclick="mostrarTela('tela5')">
            🛒 Carrinho
            <span id="contadorCarrinho" class="contador">0</span>
        </button>

        <button onclick="mostrarTela('tela4')">
            📱 Pagamento
        </button>

    </div>


    <!-- =========================
         TELA CADASTRO
    ========================== -->

    <div class="tela" id="tela2">

        <h2>👤 Cadastro</h2>

        <input
            type="text"
            id="nome"
            placeholder="Digite seu nome"
        >

        <input
            type="email"
            id="email"
            placeholder="Digite seu e-mail"
        >

        <input
            type="tel"
            id="telefone"
            placeholder="Digite seu telefone"
        >

        <button onclick="salvarCadastro()">
            💾 Salvar cadastro
        </button>

        <div id="dadosSalvos"></div>

        <button onclick="mostrarTela('tela1')">
            ← Voltar
        </button>

    </div>


    <!-- =========================
         TELA PRODUTOS
    ========================== -->

    <div class="tela" id="tela3">

        <h2>🛍️ Produtos</h2>


        <!-- PRODUTO 1 -->

        <div class="produto">

            <h3>Produto 1</h3>

            <img
                src="3814635.webp"
                alt="Imagem do Produto 1"
            >

            <p>
                Produto básico
            </p>

            <span class="preco">
                R$ 10,00
            </span>

            <button onclick="adicionarCarrinho('Produto 1', 10)">
                ➕ Adicionar ao carrinho
            </button>

        </div>


        <!-- PRODUTO 2 -->

        <div class="produto">

            <h3>Produto 2</h3>

            <img
                src="whey.jpg"
                alt="Imagem do Produto 2"
            >

            <p>
                Produto intermediário
            </p>

            <span class="preco">
                R$ 20,00
            </span>

            <button onclick="adicionarCarrinho('Produto 2', 20)">
                ➕ Adicionar ao carrinho
            </button>

        </div>


        <!-- PRODUTO 3 -->

        <div class="produto">

            <h3>Produto 3</h3>

            <img
                src="paracetamol.webp"
                alt="Imagem do Produto 3"
            >

            <p>
                Produto premium
            </p>

            <span class="preco">
                R$ 30,00
            </span>

            <button onclick="adicionarCarrinho('Produto 3', 30)">
                ➕ Adicionar ao carrinho
            </button>

        </div>


        <button onclick="mostrarTela('tela5')">
            🛒 Ver carrinho
        </button>

        <button onclick="mostrarTela('tela1')">
            ← Voltar
        </button>

    </div>


    <!-- =========================
         TELA PAGAMENTO
    ========================== -->

    <div class="tela" id="tela4">

        <h2>📱 Pagamento</h2>

        <div class="qr">

            <p>
                Confira o valor da sua compra:
            </p>

            <img
                id="qrCode"
                class="qr-code"
                alt="QR Code"
            >

            <p id="valorPagamento">
                Total: R$ 0,00
            </p>

        </div>

        <button
            class="btn-verde"
            onclick="finalizarCompra()"
        >
            ✅ Finalizar compra
        </button>

        <button onclick="mostrarTela('tela5')">
            ← Voltar para o carrinho
        </button>

        <button onclick="mostrarTela('tela1')">
            🏠 Início
        </button>

    </div>


    <!-- =========================
         TELA CARRINHO
    ========================== -->

    <div class="tela" id="tela5">

        <h2>🛒 Carrinho</h2>

        <div id="listaCarrinho">

            <div class="vazio">
                Seu carrinho está vazio.
            </div>

        </div>

        <div
            class="total"
            id="total"
        >
            Total: R$ 0,00
        </div>


        <button
            class="btn-verde"
            onclick="irParaPagamento()"
        >
            💳 Ir para pagamento
        </button>


        <button
            class="btn-vermelho"
            onclick="limparCarrinho()"
        >
            🗑️ Limpar carrinho
        </button>


        <button onclick="mostrarTela('tela3')">
            ← Continuar comprando
        </button>


        <button onclick="mostrarTela('tela1')">
            🏠 Início
        </button>

    </div>

</div>


<script>

/* =====================================
   VARIÁVEL DO CARRINHO
===================================== */

let carrinho = [];


/* =====================================
   MOSTRAR TELA
===================================== */

function mostrarTela(id) {

    const telas = document.querySelectorAll(".tela");

    telas.forEach(function(tela) {
        tela.classList.remove("ativa");
    });

    const telaSelecionada =
        document.getElementById(id);

    if (!telaSelecionada) {
        return;
    }

    telaSelecionada.classList.add("ativa");


    if (id === "tela5") {
        atualizarCarrinho();
    }


    if (id === "tela4") {
        atualizarPagamento();
    }
}


/* =====================================
   CADASTRO
===================================== */

function salvarCadastro() {

    const nome =
        document.getElementById("nome").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const telefone =
        document.getElementById("telefone").value.trim();


    if (nome === "") {

        alert("Digite seu nome.");

        return;
    }


    if (email === "") {

        alert("Digite seu e-mail.");

        return;
    }


    if (telefone === "") {

        alert("Digite seu telefone.");

        return;
    }


    const cadastro = {
        nome: nome,
        email: email,
        telefone: telefone
    };


    localStorage.setItem(
        "cadastroLoja",
        JSON.stringify(cadastro)
    );


    mostrarCadastro();


    alert("✅ Cadastro salvo com sucesso!");
}


/* =====================================
   MOSTRAR CADASTRO
===================================== */

function mostrarCadastro() {

    const dados =
        localStorage.getItem("cadastroLoja");


    if (!dados) {
        return;
    }


    const cadastro =
        JSON.parse(dados);


    document.getElementById("dadosSalvos").innerHTML = `

        <div class="dados">

            <strong>Cadastro salvo:</strong>

            <p>
                Nome: ${cadastro.nome}
            </p>

            <p>
                E-mail: ${cadastro.email}
            </p>

            <p>
                Telefone: ${cadastro.telefone}
            </p>

        </div>
    `;
}


/* =====================================
   ADICIONAR PRODUTO
===================================== */

function adicionarCarrinho(nome, preco) {

    carrinho.push({
        nome: nome,
        preco: Number(preco)
    });


    salvarCarrinho();

    atualizarCarrinho();

    atualizarContador();


    alert(
        "✅ " +
        nome +
        " foi adicionado ao carrinho!"
    );
}


/* =====================================
   SALVAR CARRINHO
===================================== */

function salvarCarrinho() {

    localStorage.setItem(
        "carrinhoLoja",
        JSON.stringify(carrinho)
    );
}


/* =====================================
   CARREGAR CARRINHO
===================================== */

function carregarCarrinho() {

    const dados =
        localStorage.getItem("carrinhoLoja");


    if (!dados) {
        return;
    }


    try {

        carrinho = JSON.parse(dados);

        if (!Array.isArray(carrinho)) {
            carrinho = [];
        }

    } catch (erro) {

        carrinho = [];
    }
}


/* =====================================
   CONTADOR
===================================== */

function atualizarContador() {

    const contador =
        document.getElementById("contadorCarrinho");


    if (contador) {

        contador.innerText =
            carrinho.length;
    }
}


/* =====================================
   ATUALIZAR CARRINHO
===================================== */

function atualizarCarrinho() {

    const lista =
        document.getElementById("listaCarrinho");

    const totalElemento =
        document.getElementById("total");


    if (!lista || !totalElemento) {
        return;
    }


    lista.innerHTML = "";


    if (carrinho.length === 0) {

        lista.innerHTML = `
            <div class="vazio">
                Seu carrinho está vazio.
            </div>
        `;


        totalElemento.innerText =
            "Total: R$ 0,00";


        atualizarContador();

        return;
    }


    let total = 0;


    carrinho.forEach(function(item, index) {

        const preco =
            Number(item.preco);


        total += preco;


        const itemDiv =
            document.createElement("div");


        itemDiv.className =
            "item-carrinho";


        itemDiv.innerHTML = `

            <span>
                ${item.nome}
            </span>

            <strong>
                R$ ${preco
                    .toFixed(2)
                    .replace(".", ",")}
            </strong>

            <button
                onclick="removerItem(${index})"
            >
                ❌
            </button>
        `;


        lista.appendChild(itemDiv);
    });


    totalElemento.innerText =
        "Total: R$ " +
        total.toFixed(2).replace(".", ",");


    atualizarContador();
}


/* =====================================
   REMOVER ITEM
===================================== */

function removerItem(index) {

    if (
        index < 0 ||
        index >= carrinho.length
    ) {
        return;
    }


    carrinho.splice(index, 1);


    salvarCarrinho();

    atualizarCarrinho();

    atualizarContador();
}


/* =====================================
   LIMPAR CARRINHO
===================================== */

function limparCarrinho() {

    if (carrinho.length === 0) {

        alert(
            "O carrinho já está vazio."
        );

        return;
    }


    const confirmar =
        confirm(
            "Tem certeza que deseja limpar o carrinho?"
        );


    if (!confirmar) {
        return;
    }


    carrinho = [];


    salvarCarrinho();

    atualizarCarrinho();

    atualizarContador();


    alert("🗑️ Carrinho limpo!");
}


/* =====================================
   CALCULAR TOTAL
===================================== */

function calcularTotal() {

    let total = 0;


    carrinho.forEach(function(item) {

        total += Number(item.preco);

    });


    return total;
}


/* =====================================
   PAGAMENTO
===================================== */

function irParaPagamento() {

    if (carrinho.length === 0) {

        alert(
            "⚠️ Seu carrinho está vazio.\n\n" +
            "Adicione um produto primeiro."
        );

        return;
    }


    mostrarTela("tela4");
}


/* =====================================
   ATUALIZAR PAGAMENTO
===================================== */

function atualizarPagamento() {

    const total =
        calcularTotal();


    const valor =
        document.getElementById(
            "valorPagamento"
        );


    const qr =
        document.getElementById(
            "qrCode"
        );


    if (!valor || !qr) {
        return;
    }


    valor.innerText =
        "Total: R$ " +
        total.toFixed(2).replace(".", ",");


    /*
       QR CODE DEMONSTRATIVO.

       Ele mostra o valor da compra,
       mas ainda NÃO é um Pix real.
    */

    const mensagem =
        "Loja Rapida - Total R$ " +
        total.toFixed(2);


    qr.src =
        "https://api.qrserver.com/v1/create-qr-code/" +
        "?size=200x200&data=" +
        encodeURIComponent(mensagem);
}


/* =====================================
   FINALIZAR COMPRA
===================================== */

function finalizarCompra() {

    if (carrinho.length === 0) {

        alert(
            "Não há produtos no carrinho."
        );

        return;
    }


    const total =
        calcularTotal();


    const confirmar =
        confirm(
            "Confirmar compra de R$ " +
            total.toFixed(2).replace(".", ",") +
            "?"
        );


    if (!confirmar) {
        return;
    }


    alert(
        "🎉 Compra finalizada com sucesso!\n\n" +
        "Total: R$ " +
        total.toFixed(2).replace(".", ",") +
        "\n\n" +
        "Obrigado pela compra!"
    );


    carrinho = [];


    salvarCarrinho();

    atualizarCarrinho();

    atualizarContador();


    mostrarTela("tela1");
}


/* =====================================
   INICIAR
===================================== */

carregarCarrinho();

mostrarCadastro();

atualizarCarrinho();

atualizarContador();

</script>

</body>
</html>
